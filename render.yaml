# Render Blueprint — ATLAS: Postgres + API (Fastify) + web (Next.js), free plans.
# Deploy: Render Dashboard → New → Blueprint → select this repo.
#
# The web app bakes NEXT_PUBLIC_API_URL in at build time, and the API's CORS
# allow-list (WEB_ORIGIN) needs the web URL. Both are pinned to the default
# onrender.com URLs of the service names below. If Render reports a name as
# taken and appends a suffix, set those two variables to the real URLs in the
# dashboard and redeploy the web service (it must rebuild to pick up the URL).

databases:
  - name: atlas-0xuntamed-db
    plan: free
    databaseName: atlas
    user: atlas
    postgresMajorVersion: "16"
    ipAllowList: [] # no public access; services connect over the internal URL

services:
  - type: web
    name: atlas-0xuntamed-api
    runtime: node
    plan: free
    buildCommand: >-
      npm install -g pnpm@10.30.0 &&
      pnpm install --frozen-lockfile --filter @atlas/api... &&
      pnpm --filter @atlas/api build
    # Free plans have no pre-deploy hook, so migrations run on boot.
    startCommand: >-
      cd apps/api &&
      npx prisma migrate deploy &&
      NODE_ENV=production node dist/server.js
    healthCheckPath: /health
    buildFilter:
      paths:
        - apps/api/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: API_PORT
        value: "10000" # Render routes traffic to 10000 by default
      - key: DATABASE_URL
        fromDatabase:
          name: atlas-0xuntamed-db
          property: connectionString
      - key: WEB_ORIGIN
        value: https://atlas-0xuntamed-web.onrender.com
      - key: TRUST_PROXY
        value: "true" # behind Render's proxy; rate limiting needs real client IPs
      - key: AUTH_MODE
        value: mock # no Clerk yet — every visitor shares one dev user
      - key: PLACES_PROVIDER
        value: auto # add OPENTRIPMAP_API_KEY in the dashboard for real places

  - type: web
    name: atlas-0xuntamed-web
    runtime: node
    plan: free
    buildCommand: >-
      npm install -g pnpm@10.30.0 &&
      pnpm install --frozen-lockfile --filter @atlas/web... &&
      pnpm --filter @atlas/web build
    startCommand: cd apps/web && npx next start # honours Render's PORT
    buildFilter:
      paths:
        - apps/web/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_API_URL
        value: https://atlas-0xuntamed-api.onrender.com
      - key: NEXT_PUBLIC_AUTH_MODE
        value: mock
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
